<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fff0be"/>
      <stop offset="35%" stop-color="#e2ba61"/>
      <stop offset="70%" stop-color="#d4af37"/>
      <stop offset="100%" stop-color="#8c6710"/>
    </linearGradient>
    <radialGradient id="bgGrad" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#1b1e2c"/>
      <stop offset="100%" stop-color="#090a0f"/>
    </radialGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="1.5" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Circular Badge Background -->
  <circle cx="32" cy="32" r="30" fill="url(#bgGrad)" stroke="url(#goldGrad)" stroke-width="2"/>
  <circle cx="32" cy="32" r="27" fill="none" stroke="url(#goldGrad)" stroke-width="0.75" stroke-dasharray="2 2" opacity="0.6"/>

  <!-- Royal Crown on top -->
  <path d="M22 22 L24 28 L32 23 L40 28 L42 22 L38 31 L26 31 Z" fill="url(#goldGrad)" filter="url(#glow)"/>
  <circle cx="22" cy="21" r="1.5" fill="#fff4d0"/>
  <circle cx="32" cy="22" r="1.8" fill="#fff4d0"/>
  <circle cx="42" cy="21" r="1.5" fill="#fff4d0"/>

  <!-- Intertwined Wedding Rings -->
  <!-- Left Ring (Sara) -->
  <circle cx="26" cy="40" r="9" fill="none" stroke="url(#goldGrad)" stroke-width="3" filter="url(#glow)"/>
  <!-- Right Ring (Tewodros) -->
  <circle cx="38" cy="40" r="9" fill="none" stroke="url(#goldGrad)" stroke-width="3" filter="url(#glow)"/>

  <!-- Diamond Gem on Ring -->
  <polygon points="26,29 28,32 26,35 24,32" fill="#ffffff"/>
  <circle cx="26" cy="32" r="1.2" fill="#ffffff" filter="url(#glow)"/>

  <!-- Center Heart Accent -->
  <path d="M32 38 C32 36.5 30.5 35 29 35 C27.5 35 26.5 36.5 26.5 37.8 C26.5 40 32 43.5 32 43.5 C32 43.5 37.5 40 37.5 37.8 C37.5 36.5 36.5 35 35 35 C33.5 35 32 36.5 32 38 Z" fill="url(#goldGrad)" opacity="0.9"/>
</svg>
